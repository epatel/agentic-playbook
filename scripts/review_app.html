<!doctype html>
<!-- The review server's one page. Served by scripts/review_server.py; see its docstring.

     The design is a galley proof. The middle column is the book, set exactly as the book sets
     itself — same serif, same measure, same palette as `make html`, because you are reviewing the
     book and it should look like the book. The review layer is the only thing that is not the
     book, and it is drawn in an editor's red: an underline under a marked passage, a change bar
     beside the block under the cursor, and notes that hang in the margin beside the line they are
     about rather than stacking in a list somewhere else. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Agentic Playbook — review</title>
<link rel="stylesheet" href="/book.css">
<style>
  /* book.css lays the built book out as a document: one reading column, indented past a fixed
     contents sidebar, with a rule above every chapter opener. This is an app shell, so that has to
     go. The selector is copied from book.css deliberately — `:not(#TOC)` carries an id's
     specificity, so `body > nav` loses to it however obvious it looks. Same selector, same
     specificity, loaded afterwards; it also neutralises the two copies in book.css's own media
     queries. */
  body > :not(#TOC) { max-width: none; margin: 0; padding: 0; }

  /* Everything lives inside #app so that the rule above has exactly one element to neutralise.
     Left as direct children of <body>, the three columns inherit that reset too, and a class
     selector cannot win it back — `:not(#TOC)` outranks `.contents` however specific it looks. */
  #app { display: contents; }

  :root {
    --mark: #b4362f;              /* the editor's pencil; the only colour the book does not have */
    --mark-wash: rgba(180, 54, 47, .09);
    --shell: #f3f2ef;             /* the desk the proof lies on, a shade off the page */
  }
  @media (prefers-color-scheme: dark) {
    :root { --mark: #e2796f; --mark-wash: rgba(226, 121, 111, .13); --shell: #131417; }
  }

  body {
    display: grid;
    grid-template-columns: 16.5rem minmax(0, 1fr) 21rem;
    min-height: 100vh;
    background: var(--shell);
  }
  #app > * { min-width: 0; }   /* #app is display:contents, so its children are the grid items */
  /* book.css hyphenates for justified print. In a narrow column that gives 'be-fore this'. */
  .contents, .margin { hyphens: manual; }

  /* book.css predates border-box and the book's own blocks are laid out assuming content-box,
     so this is scoped to the chrome: a textarea at width:100% plus padding and a border
     otherwise overflows the margin it sits in. The sheet keeps the book's own box model. */
  .contents, .contents *, .margin, .margin * { box-sizing: border-box; }

  /* ------------------------------------------------------------------ contents */

  .contents {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    padding: 2rem 1.1rem 3rem 1.6rem;
  }
  .wordmark { font-size: 1rem; line-height: 1.25; margin: 0 0 .15rem; font-weight: 600; letter-spacing: -.01em; }
  .readers { font-size: .8rem; color: var(--ink-faint); font-style: italic; margin-bottom: 1.4rem;
             display: flex; align-items: baseline; gap: .45rem; }
  .readers::before { content: ""; width: .4rem; height: .4rem; border-radius: 50%;
                     background: var(--mark); flex: none; transform: translateY(-.1em); }
  .readers.offline::before { background: var(--ink-faint); }

  .who {
    width: 100%; font: inherit; font-size: .84rem; padding: .3rem 0; margin-bottom: 1.6rem;
    border: 0; border-bottom: 1px solid var(--rule); background: none; color: var(--ink);
  }
  .who:focus { outline: none; border-bottom-color: var(--mark); }
  .who::placeholder { color: var(--ink-faint); font-style: italic; }

  .part { font-size: .82rem; font-style: italic; color: var(--ink-faint); margin: 1.5rem 0 .4rem; }
  .part:first-child { margin-top: 0; }
  .contents a {
    display: block; padding: .2rem 0 .2rem .7rem; margin-left: -.7rem;
    border-left: 2px solid transparent;
    font-size: .86rem; line-height: 1.4; text-decoration: none; color: var(--ink-soft);
  }
  .contents a:hover { color: var(--ink); }
  .contents a[aria-current] { color: var(--ink); border-left-color: var(--ink); font-weight: 600; }
  .contents a .n { color: var(--mark); font-size: .8rem; margin-left: .3rem; }

  /* ------------------------------------------------------------------ the proof */

  .proof { background: var(--page); border-inline: 1px solid var(--rule); }
  .sheet { max-width: 35rem; margin: 0 auto; padding: 3.5rem 1.5rem 60vh; position: relative; }

  /* The book's own chapter opener is a printed page-break device: a 3px rule and five rems of
     air. On screen it reads as a stray line at the top of the column. */
  .sheet h1 { margin: 0 0 1.8rem; padding: 0; border-top: 0; font-size: 1.75rem; }
  .sheet { hyphens: manual; }          /* book.css hyphenates for justified print; this is ragged */

  .sheet [data-line] { position: relative; }
  .sheet [data-line]::before {
    content: ""; position: absolute; left: -1.5rem; top: .15em; bottom: .15em; width: 2px;
    background: var(--ink-faint); opacity: 0; border-radius: 1px;
  }
  .sheet [data-line]:hover::before { opacity: .35; }      /* a proofreader's change bar */
  .sheet [data-line].cited::before { opacity: 1; background: var(--mark); }

  /* A marked passage is underlined, the way an editor marks one — not filled in like a highlighter. */
  .mark {
    text-decoration: underline 1.5px var(--mark);
    text-underline-offset: .22em;
    background: transparent;
    cursor: pointer;
  }
  .mark:hover, .mark.lit { background: var(--mark-wash); }

  /* Read aloud. The button sits in the gutter beside its heading, like the change bar, and is
     only visible when the section is under the cursor or speaking. */
  .sheet h1, .sheet h2 { position: relative; }
  .speak {
    position: absolute; left: -1.5rem;               /* the gutter the change bars use */
    width: 1.15rem; height: 1.15rem; padding: 0; border: 0; border-radius: 50%;
    background: none; color: var(--ink-faint); cursor: pointer;
    display: grid; place-items: center; font-size: .68rem; line-height: 1;
    opacity: .5;   /* visible, quietly: hidden-until-hover hid it from the person who wanted it */
    /* Vertical position is in rem, measured against book.css's heading sizes. Neither `em` nor
       `lh` works here: both resolve against this button's own font-size, and a unitless
       line-height inherited from the heading does the same. If book.css changes a heading's size
       or line-height, re-measure these two. */
  }
  .sheet h1 .speak { top: .48rem; }    /* the chapter title: no rule, no padding */
  .sheet h2 .speak { top: 1.56rem; }   /* a section: clears book.css's rule and 1.25rem padding */
  .sheet h1:hover .speak, .sheet h2:hover .speak, .speak:hover, .speak:focus-visible,
  .speak.on { opacity: 1; }
  .speak:hover, .speak.on { color: var(--mark); }
  .speaking { background: var(--mark-wash); border-radius: 2px; box-shadow: 0 0 0 .3rem var(--mark-wash); }

  /* Below the desktop breakpoint there is no gutter to hang the button in: the heading starts at
     the edge of the screen, so `left: -1.4rem` puts the button off it. On a narrow screen it
     joins the line instead of sitting beside it. */
  @media (max-width: 62rem) {
    .speak {
      position: static;
      display: inline-grid;
      vertical-align: middle;
      margin-right: .4rem;
      transform: translateY(-.06em);
    }
  }

  .voice { font-size: .74rem; font-style: italic; color: var(--ink-faint); margin: -1rem 0 1.4rem; }

  /* ------------------------------------------------------------------ the margin */

  .margin { position: relative; padding: 3.5rem 1.4rem 60vh 1.1rem; }
  .margin .none { font-size: .84rem; font-style: italic; color: var(--ink-faint); }

  .note {
    position: absolute; left: 1.1rem; right: 1.4rem;
    font-size: .82rem; line-height: 1.5;
    border-left: 2px solid var(--mark);
    padding: 0 0 .1rem .75rem;
  }
  .note.resolved { border-left-color: var(--rule); color: var(--ink-faint); }
  .note .lead { position: absolute; left: -1.1rem; top: .55em; width: 1.1rem; height: 1px; background: var(--mark); opacity: .45; }
  .note.resolved .lead { background: var(--rule); }
  .note .said { white-space: pre-wrap; }
  .note .quote { font-style: italic; color: var(--ink-faint); margin-bottom: .3rem; }
  .note .by { color: var(--ink-faint); font-size: .78rem; margin-top: .25rem; }
  .note .acts { display: none; gap: .8rem; margin-top: .35rem; }
  .note:hover .acts, .note:focus-within .acts { display: flex; }
  .note .acts button {
    border: 0; background: none; padding: 0; font: inherit; font-size: .78rem;
    color: var(--ink-faint); text-decoration: underline; text-underline-offset: .2em; cursor: pointer;
  }
  .note .acts button:hover { color: var(--mark); }
  .note.lit { color: var(--ink); }
  .note.lit .lead { opacity: 1; }

  /* ------------------------------------------------------------------ the composer */

  .composer { position: absolute; left: 1.1rem; right: 1.4rem; border-left: 2px solid var(--mark); padding-left: .75rem; }
  .composer[hidden] { display: none; }
  .composer .quote { font-style: italic; color: var(--ink-faint); font-size: .82rem; margin-bottom: .4rem; }
  .composer textarea {
    width: 100%; min-height: 5rem; font: inherit; font-size: .82rem; line-height: 1.5;
    padding: .4rem .5rem; border: 1px solid var(--rule); border-radius: 2px;
    background: var(--page); color: var(--ink); resize: vertical;
  }
  .composer textarea:focus { outline: none; border-color: var(--mark); }
  .composer .row { display: flex; gap: .9rem; align-items: baseline; margin-top: .45rem; }
  .composer .row .hint { font-size: .74rem; color: var(--ink-faint); margin-left: auto; }
  .composer button {
    font: inherit; font-size: .8rem; padding: .25rem .8rem; border: 1px solid var(--mark);
    border-radius: 2px; background: var(--mark); color: #fff; cursor: pointer;
  }
  .composer button.quiet { background: none; color: var(--ink-faint); border-color: transparent; padding-inline: 0; text-decoration: underline; text-underline-offset: .2em; }

  :focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 62rem) {
    body { grid-template-columns: 1fr; }
    .contents, .margin { position: static; height: auto; }
    .proof { border-inline: 0; }
    .note, .composer { position: static; margin-bottom: 1rem; }
    .note .lead { display: none; }
  }
</style>
</head>
<body>
<div id="app">

<nav class="contents">
  <p class="wordmark">The Agentic Playbook</p>
  <p class="readers" id="readers">connecting</p>
  <input class="who" id="who" placeholder="who is reading?" autocomplete="name">
  <p class="voice" id="voice"></p>
  <div id="toc"></div>
</nav>

<main class="proof"><article class="sheet" id="chapter"></article></main>

<aside class="margin" id="margin">
  <p class="none" id="none">Select a passage to mark it.</p>
  <form class="composer" id="composer" hidden>
    <p class="quote" id="composerQuote"></p>
    <textarea id="composerText" placeholder="What is wrong with this passage?"></textarea>
    <div class="row">
      <button type="submit">Save note</button>
      <button type="button" class="quiet" id="composerCancel">Cancel</button>
      <span class="hint">⌘↵</span>
    </div>
  </form>
</aside>

</div>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
mermaid.initialize({ startOnLoad: false, theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });

const $ = (s) => document.querySelector(s);
const state = { toc: [], path: null, annotations: [], pending: null, socket: null };

const who = $('#who');
who.value = localStorage.getItem('reviewer') || '';
who.addEventListener('change', () => localStorage.setItem('reviewer', who.value.trim()));

/* ---------------------------------------------------------------------- the wire */
function connect() {
  const socket = new WebSocket(`ws://${location.host}/ws`);
  state.socket = socket;
  socket.onclose = () => {
    $('#readers').classList.add('offline');
    $('#readers').textContent = 'reconnecting';
    setTimeout(connect, 1500);
  };
  socket.onmessage = (event) => {
    const message = JSON.parse(event.data);
    if (message.annotations) state.annotations = message.annotations;
    if (message.readers !== undefined) {
      $('#readers').classList.remove('offline');
      $('#readers').textContent = message.readers === 1
        ? 'reading alone' : `${message.readers} reading`;
    }
    draw();
  };
}
const send = (m) => state.socket?.readyState === 1 && state.socket.send(JSON.stringify(m));

/* ------------------------------------------------------------------ the chapters */
async function loadToc() {
  state.toc = await (await fetch('/api/toc')).json();
  drawToc();
  const wanted = decodeURIComponent(location.hash.slice(1));
  openChapter(state.toc.some(c => c.path === wanted) ? wanted : state.toc[0]?.path);
}

function drawToc() {
  const counts = {};
  for (const a of state.annotations) if (a.status === 'open') counts[a.file] = (counts[a.file] || 0) + 1;
  let html = '', part = null;
  for (const c of state.toc) {
    if (c.part !== part) { part = c.part; html += `<p class="part">${esc(part)}</p>`; }
    const n = counts[c.path] ? `<span class="n">${counts[c.path]}</span>` : '';
    const here = c.path === state.path ? ' aria-current="page"' : '';
    html += `<a href="#${encodeURIComponent(c.path)}"${here}>${esc(c.title)}${n}</a>`;
  }
  $('#toc').innerHTML = html;
}

async function openChapter(path) {
  if (!path) return;
  state.path = path;
  const chapter = await (await fetch(`/api/chapter/${path}`)).json();
  stopSpeech();
  $('#chapter').innerHTML = chapter.html;
  addSpeakButtons();
  location.hash = encodeURIComponent(path);
  closeComposer();
  drawToc(); draw();
  const diagrams = $('#chapter').querySelectorAll('pre.mermaid');
  if (diagrams.length) mermaid.run({ nodes: diagrams }).then(place);
}
addEventListener('hashchange', () => {
  const path = decodeURIComponent(location.hash.slice(1));
  if (path && path !== state.path) openChapter(path);
});

/* --------------------------------------------------------- marking a passage */
$('#chapter').addEventListener('mouseup', () => setTimeout(offerMark, 0));

function offerMark() {
  const selection = getSelection();
  const quote = selection.toString().trim();
  if (!quote || selection.isCollapsed) return;
  let node = selection.anchorNode;
  while (node && !(node.nodeType === 1 && node.hasAttribute?.('data-line'))) node = node.parentNode;
  if (!node || !$('#chapter').contains(node)) return;

  state.pending = { file: state.path, line: Number(node.getAttribute('data-line')), quote };
  $('#composerQuote').textContent = shorten(quote, 150);
  $('#composerText').value = '';
  $('#composer').hidden = false;
  $('#none').hidden = true;
  place();
  $('#composerText').focus();
}

function closeComposer() {
  $('#composer').hidden = true;
  state.pending = null;
  draw();
}
$('#composerCancel').onclick = closeComposer;
$('#composer').addEventListener('submit', (event) => {
  event.preventDefault();
  const comment = $('#composerText').value.trim();
  if (comment && state.pending) {
    send({ type: 'create', ...state.pending, comment, author: who.value.trim() || 'anonymous' });
  }
  closeComposer();
});
$('#composerText').addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) $('#composer').requestSubmit();
  if (event.key === 'Escape') closeComposer();
});

/* ---------------------------------------------------------------- read aloud */
/* Edge exposes its natural voices to the Web Speech API, which is the only reason this sounds
   like Read Aloud rather than like a 1998 screen reader. Andrew first, then any natural en-US,
   then whatever the browser has — the feature degrades rather than disappearing. */
const speech = { voice: null, blocks: [], at: 0, on: null };

async function pickVoice() {
  let all = speechSynthesis.getVoices();
  if (!all.length) {
    await new Promise(r => { speechSynthesis.onvoiceschanged = r; setTimeout(r, 1500); });
    all = speechSynthesis.getVoices();
  }
  const en = all.filter(v => v.lang.startsWith('en'));
  speech.voice =
    en.find(v => /\bAndrew\b/i.test(v.name) && !/Multilingual/i.test(v.name)) ||
    en.find(v => /Andrew/i.test(v.name)) ||
    en.find(v => /Natural/i.test(v.name) && v.lang === 'en-US') ||
    en.find(v => v.default) || en[0] || null;
  const name = speech.voice ? speech.voice.name.replace(/^Microsoft /, '').replace(/ - .*$/, '') : 'none';
  $('#voice').textContent = speech.voice ? `reading aloud as ${name}` : 'no voice available';
}


/* Spoken-only respellings. The page still shows the word exactly as written; only the string
   handed to the speech engine changes. Add a pair here whenever the synthesiser gets a word
   wrong — it is the one place where the book's text and the book's sound are allowed to differ. */
const SAY = [
  [/\bPreface\b/g, 'Pre face'],
];
const spoken = (text) => SAY.reduce((out, [from, to]) => out.replace(from, to), text);
/* One utterance per sentence. A whole paragraph in one utterance runs past the point where
   Chromium quietly stops speaking, and sentence-sized pieces also make the pauses sound right. */
function sentences(text) {
  const parts = text.replace(/\s+/g, ' ').trim().split(/(?<=[.!?])\s+(?=[A-Z"'\u201c\u2018])/);
  const out = [];
  for (const part of parts) {
    if (out.length && part.length < 40) out[out.length - 1] += ' ' + part;
    else out.push(part);
  }
  return out.filter(Boolean);
}

/* Code, tables and diagrams are not prose and do not survive being read out. */
const READABLE = 'p, ul, ol, blockquote, h1, h2, h3, h4';

/* The play button lives inside its heading so it can be positioned against it, which means the
   heading's own textContent starts with a triangle. Strip it, or the first thing read aloud in
   every section is a piece of punctuation. */
function textOf(el) {
  const clone = el.cloneNode(true);
  for (const button of clone.querySelectorAll('.speak')) button.remove();
  return clone.textContent;
}

/* `> Captured September 2026, BSD wc on macOS 26.4.` is provenance for the block beneath it — a
   convention of book/TEMPLATE-play.md — and reading tool versions aloud mid-example helps nobody. */
const isProvenance = (el) => el.tagName === 'BLOCKQUOTE' && /^\s*Captured\b/.test(el.textContent);
const readable = (el) => el.matches(READABLE) && !el.closest('pre, table') && !isProvenance(el);

function blocksOf(heading) {
  if (heading.tagName === 'H1') {
    return [...$('#chapter').querySelectorAll(READABLE)].filter(readable);
  }
  const out = [heading];
  for (let el = heading.nextElementSibling; el; el = el.nextElementSibling) {
    if (el.tagName === heading.tagName) break;
    if (readable(el)) out.push(el);
  }
  return out;
}

function stopSpeech() {
  speechSynthesis.cancel();
  for (const el of $('#chapter').querySelectorAll('.speaking')) el.classList.remove('speaking');
  for (const b of $('#chapter').querySelectorAll('.speak.on')) {
    b.classList.remove('on'); b.textContent = '▶'; b.title = 'Read this section aloud';
  }
  speech.blocks = []; speech.at = 0; speech.on = null;
}

function speakFrom(index) {
  const block = speech.blocks[index];
  if (!block) return stopSpeech();
  for (const el of $('#chapter').querySelectorAll('.speaking')) el.classList.remove('speaking');
  block.classList.add('speaking');
  if (block.getBoundingClientRect().top > innerHeight - 80 || block.getBoundingClientRect().top < 60) {
    block.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  const queue = sentences(spoken(textOf(block)));
  let done = 0;
  for (const line of queue) {
    const u = new SpeechSynthesisUtterance(line);
    if (speech.voice) { u.voice = speech.voice; u.lang = speech.voice.lang; }
    u.onend = () => { if (++done === queue.length && speech.on) speakFrom(index + 1); };
    u.onerror = () => { if (++done === queue.length && speech.on) speakFrom(index + 1); };
    speechSynthesis.speak(u);
  }
}

function toggleSpeak(button, heading) {
  const wasOn = button.classList.contains('on');
  stopSpeech();
  if (wasOn) return;
  speech.on = button;
  speech.blocks = blocksOf(heading);
  button.classList.add('on'); button.textContent = '■'; button.title = 'Stop';
  speakFrom(0);
}

function addSpeakButtons() {
  for (const heading of $('#chapter').querySelectorAll('h1, h2')) {
    const button = document.createElement('button');
    button.className = 'speak';
    button.textContent = '▶';
    button.title = heading.tagName === 'H1' ? 'Read the chapter aloud' : 'Read this section aloud';
    button.setAttribute('aria-label', button.title);
    button.onclick = (e) => { e.stopPropagation(); toggleSpeak(button, heading); };
    heading.prepend(button);
  }
}
addEventListener('beforeunload', () => speechSynthesis.cancel());

/* ------------------------------------------------------------------- the margin */
function draw() {
  const mine = state.annotations
    .filter(a => a.file === state.path)
    .sort((a, b) => (a.line - b.line) || a.ts.localeCompare(b.ts));

  for (const old of $('#margin').querySelectorAll('.note')) old.remove();
  $('#none').hidden = mine.length > 0 || !$('#composer').hidden;
  $('#none').textContent = mine.length ? '' : 'Select a passage to mark it.';

  for (const a of mine) {
    const note = document.createElement('div');
    note.className = 'note' + (a.status === 'resolved' ? ' resolved' : '');
    note.dataset.id = a.id;
    note.dataset.anchor = a.line;
    note.innerHTML = `
      <span class="lead"></span>
      ${a.quote ? `<p class="quote">${esc(shorten(a.quote, 110))}</p>` : ''}
      <div class="said">${esc(a.comment)}</div>
      <p class="by">${esc(a.author || 'anonymous')}, line ${a.line}</p>
      <div class="acts">
        <button data-act="${a.status === 'resolved' ? 'reopen' : 'resolve'}">${a.status === 'resolved' ? 'Reopen' : 'Resolve'}</button>
        <button data-act="delete">Delete</button>
      </div>`;
    $('#margin').append(note);
  }
  markUp();
  place();
}

$('#margin').addEventListener('click', (event) => {
  const act = event.target.dataset?.act;
  if (!act) return;
  const id = event.target.closest('.note').dataset.id;
  if (act === 'delete' && !confirm('Delete this note? The event log keeps a record.')) return;
  send({ type: act, id });
});

/* The block an annotation belongs to. An exact hit is the normal case, but a stored line can
   fall inside a block rather than at its head — the book has been edited since, or the note was
   made against a line the renderer does not start a block on — so fall back to the last block
   that begins at or before it. A note with nowhere to hang would silently vanish. */
function blockFor(line) {
  const sheet = $('#chapter');
  const exact = sheet.querySelector(`[data-line="${line}"]`);
  if (exact) return exact;
  let best = null;
  for (const block of sheet.querySelectorAll('[data-line]')) {
    if (Number(block.dataset.line) <= Number(line)) best = block; else break;
  }
  return best || sheet.querySelector('[data-line]');
}

/* Put every note beside the line it is about, then push apart anything that collides. */
function place() {
  const margin = $('#margin');
  const top = margin.getBoundingClientRect().top;
  const composer = $('#composer');
  const items = [...margin.querySelectorAll('.note')];
  if (!composer.hidden && state.pending) {
    /* `dataset` is a read-only accessor: assigning the whole object throws, and a module script
       is strict mode, so the throw took the rest of this function with it and nothing was ever
       positioned. Set the key, not the map. */
    composer.dataset.anchor = state.pending.line;
    items.push(composer);
  }
  /* Down the page in anchor order, so the composer sits among the notes rather than after them.
     On a tie it goes first: the reader is looking at it. */
  items.sort((a, b) => (Number(a.dataset.anchor) - Number(b.dataset.anchor))
                       || (a === composer ? -1 : b === composer ? 1 : 0));
  let floor = 0;
  for (const item of items) {
    const anchor = blockFor(item.dataset.anchor);
    if (!anchor) continue;
    const wanted = anchor.getBoundingClientRect().top - top;
    const at = Math.max(wanted, floor);
    item.style.top = `${at}px`;
    floor = at + item.offsetHeight + 14;
  }
}
addEventListener('resize', place);
new ResizeObserver(place).observe(document.documentElement);

/* ------------------------------------------------------------------ the marks */
function markUp() {
  for (const old of $('#chapter').querySelectorAll('.mark')) {
    old.replaceWith(document.createTextNode(old.textContent));
  }
  for (const cited of $('#chapter').querySelectorAll('.cited')) cited.classList.remove('cited');
  $('#chapter').normalize();

  for (const a of state.annotations) {
    if (a.file !== state.path || a.status === 'resolved' || !a.quote) continue;
    const block = blockFor(a.line);
    if (!block) continue;
    block.classList.add('cited');
    /* Try the block it was left on; failing that, the quote itself is the anchor — which is why
       it is stored. A passage that has moved is still found, and still marked. */
    if (!underline(block, a.quote.trim(), a.id)) {
      for (const other of $('#chapter').querySelectorAll('[data-line]')) {
        if (underline(other, a.quote.trim(), a.id)) { other.classList.add('cited'); break; }
      }
    }
  }
}

function underline(block, quote, id) {
  const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    const at = node.nodeValue.indexOf(quote);
    if (at === -1) continue;              /* a quote spanning inline markup stays unmarked */
    if (node.parentElement.closest('.mark')) continue;
    const range = document.createRange();
    range.setStart(node, at);
    range.setEnd(node, at + quote.length);
    const mark = document.createElement('span');
    mark.className = 'mark';
    mark.dataset.id = id;
    range.surroundContents(mark);
    return true;
  }
  return false;
}

/* Hovering either half lights both, so it is obvious which note belongs to which passage. */
for (const [root, sel] of [[$('#chapter'), '.mark'], [$('#margin'), '.note']]) {
  root.addEventListener('mouseover', (e) => light(e.target.closest(sel)?.dataset.id, true));
  root.addEventListener('mouseout', (e) => light(e.target.closest(sel)?.dataset.id, false));
}
function light(id, on) {
  if (!id) return;
  for (const el of document.querySelectorAll(`.mark[data-id="${id}"], .note[data-id="${id}"]`)) {
    el.classList.toggle('lit', on);
  }
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shorten = (s, n) => { const t = s.replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1) + '…' : t; };

connect();
pickVoice();
loadToc();
</script>
