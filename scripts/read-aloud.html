<!-- Read aloud, injected into the HTML book by scripts/build_book.py with --include-after-body.

     A play button beside every chapter and section heading. It uses the Web Speech API, which
     means it is only as good as the voices the browser has: Edge exposes its neural voices and
     sounds like Read Aloud, Chrome offers a system voice and does not. If the browser has no
     usable voice the buttons are never drawn.

     The PDF never sees this file. Nothing here is required to read the book. -->

<style>
  :root { --aloud-wash: rgba(26, 79, 138, .09); }
  @media (prefers-color-scheme: dark) { :root { --aloud-wash: rgba(127, 178, 232, .13); } }

  h2, h3 { position: relative; }
  .aloud {
    position: absolute; left: -1.4rem;
    width: 1.15rem; height: 1.15rem; padding: 0; border: 0; border-radius: 50%;
    background: none; color: var(--ink-faint); cursor: pointer;
    display: grid; place-items: center; font-size: .68rem; line-height: 1;
    /* Visible, quietly. These were hidden until hover, on the theory that a reader who never
       wants them should never see them — which also meant the person who asked for the feature
       could not find it, and hid it completely on a touch screen. A faint mark in the gutter is
       the smaller cost. */
    opacity: .5;
    /* Vertical position is in rem, measured against book.css's heading sizes. Neither `em` nor
       `lh` works here: both resolve against this button's own font-size, and a unitless
       line-height inherited from the heading does the same. If book.css changes a heading's size
       or line-height, re-measure these two. */
    top: .3rem;          /* h2, a chapter */
  }
  h3 .aloud { top: .07rem; }
  h2:hover .aloud, h3:hover .aloud, .aloud:hover, .aloud:focus-visible, .aloud.on { opacity: 1; }
  .aloud:hover, .aloud.on { color: var(--link); }
  /* Below the desktop breakpoint there is no gutter to hang the button in: the heading starts at
     the edge of the screen, so `left: -1.4rem` puts the button off it. On a narrow screen it
     joins the line instead of sitting beside it. */
  @media (max-width: 62rem) {
    .aloud {
      position: static;
      display: inline-grid;
      vertical-align: middle;
      margin-right: .4rem;
      transform: translateY(-.06em);
    }
  }

  /* A callout on the first button only, because a faint mark in the gutter is easy to miss the
     first time and not worth making louder on every heading. Shown until the reader closes it or
     presses any ▶, then remembered in this browser. Its `left` and the arrow's `--tip` are set by
     the script from where the button actually is, since that differs between the gutter layout and
     the narrow one; the values here are only the desktop fallback. */
  .aloud-callout {
    position: absolute; bottom: calc(100% + .6rem); left: -1.9rem; z-index: 2;
    display: flex; align-items: center; gap: .6rem;
    padding: .4rem .45rem .4rem .7rem;
    background: var(--page); color: var(--ink-soft);
    border: 1px solid var(--rule); border-radius: 6px;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
    font-size: .8rem; font-weight: 400; line-height: 1.3; letter-spacing: normal;
    white-space: nowrap;
  }
  .aloud-callout::after {
    content: ""; position: absolute; bottom: -.3rem; left: calc(var(--tip, 1.075rem) - .28rem);
    width: .55rem; height: .55rem;
    background: var(--page);
    border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    transform: rotate(45deg);
  }
  .aloud-callout button {
    border: 0; background: none; padding: 0 .15rem; cursor: pointer;
    color: var(--ink-faint); font-size: 1rem; line-height: 1;
  }
  .aloud-callout button:hover, .aloud-callout button:focus-visible { color: var(--ink); }
  .aloud.called { opacity: 1; color: var(--link); }
  @media (max-width: 62rem) {
    .aloud-callout { white-space: normal; max-width: calc(100vw - 2rem); }
  }

  .aloud-speaking { background: var(--aloud-wash); border-radius: 2px; box-shadow: 0 0 0 .3rem var(--aloud-wash); }

  @media print { .aloud, .aloud-callout { display: none; } }
</style>

<script>
(function () {
  'use strict';
  if (!('speechSynthesis' in window)) return;

  var READABLE = 'p, ul, ol, blockquote, h2, h3, h4';
  var state = { voice: null, blocks: [], on: null };

  function textOf(el) {
    var clone = el.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('.aloud, .aloud-callout'), function (b) { b.remove(); });
    return clone.textContent;
  }


  /* Spoken-only respellings. The page still shows the word exactly as written; only the string
     handed to the speech engine changes. Add a pair here whenever the synthesiser gets a word
     wrong — it is the one place where the book's text and the book's sound are allowed to differ. */
  var SAY = [
    [/\bPreface\b/g, 'Pre face']
  ];

  function spoken(text) {
    SAY.forEach(function (pair) { text = text.replace(pair[0], pair[1]); });
    return text;
  }

  /* How much to hand the engine at once. Chrome's online Google voices stop about fifteen seconds
     into an utterance, so everything else gets one sentence at a time. Edge's Microsoft online
     ("Natural") voices do not stop, but they fetch each utterance over the network, so a sentence
     each puts a round trip — a pause of whatever length the network chooses — between every two
     sentences. For those, a whole block goes as one utterance, split only if it is very long, and
     the only pauses left are between paragraphs, where a reader expects one. */
  var LONG = 1500;
  var streamsWhole = function (v) { return !!v && !v.localService && /^Microsoft\b.*\bOnline\b/.test(v.name); };

  function pieces(text) {
    var list = sentences(text);
    if (!streamsWhole(state.voice)) return list;
    var out = [];
    list.forEach(function (s) {
      if (out.length && out[out.length - 1].length + s.length < LONG) out[out.length - 1] += ' ' + s;
      else out.push(s);
    });
    return out;
  }

  function sentences(text) {
    var parts = text.replace(/\s+/g, ' ').trim().split(/(?<=[.!?])\s+(?=[A-Z"'“‘])/);
    var out = [];
    parts.forEach(function (part) {
      if (out.length && part.length < 40) out[out.length - 1] += ' ' + part;
      else if (part) out.push(part);
    });
    return out;
  }

  var level = function (el) { return /^H[1-6]$/.test(el.tagName) ? +el.tagName[1] : 99; };
  /* `> Captured September 2026, BSD wc on macOS 26.4.` is provenance for the block beneath it. */
  var isProvenance = function (el) {
    return el.tagName === 'BLOCKQUOTE' && /^\s*Captured\b/.test(el.textContent);
  };
  var readable = function (el) {
    return el.matches(READABLE) && !el.closest('pre, table') && !isProvenance(el);
  };

  function blocksOf(heading) {
    var stop = level(heading), out = [heading];
    for (var el = heading.nextElementSibling; el; el = el.nextElementSibling) {
      if (level(el) <= stop) break;
      if (readable(el)) out.push(el);
    }
    return out;
  }

  /* The callout. Storage can be missing or throw (private windows, blocked site data), so every
     read and write is guarded, and without it the callout simply shows again next visit. */
  var SEEN = 'aloud-callout-dismissed';
  function seen() { try { return localStorage.getItem(SEEN) === '1'; } catch (e) { return false; } }
  function dismiss() {
    try { localStorage.setItem(SEEN, '1'); } catch (e) { /* show again next time */ }
    var callout = document.querySelector('.aloud-callout');
    if (callout) callout.remove();
    Array.prototype.forEach.call(document.querySelectorAll('.aloud.called'), function (b) {
      b.classList.remove('called');
    });
  }
  function callOut(button) {
    if (seen() || document.querySelector('.aloud-callout')) return;
    var note = document.createElement('span');
    note.className = 'aloud-callout';
    note.setAttribute('role', 'note');
    note.textContent = 'To listen, press \u25B6 beside any heading.';
    var close = document.createElement('button');
    close.type = 'button';
    close.textContent = '\u00D7';
    close.setAttribute('aria-label', 'Dismiss');
    close.addEventListener('click', function (e) { e.stopPropagation(); dismiss(); });
    note.appendChild(close);
    button.classList.add('called');
    button.parentNode.insertBefore(note, button);
    place();
    addEventListener('resize', place);
  }
  /* Start the callout a little left of the button and put the arrow's tip under its centre. */
  function place() {
    var note = document.querySelector('.aloud-callout'), button = document.querySelector('.aloud.called');
    if (!note || !button) return;
    var inset = 8;
    note.style.left = (button.offsetLeft - inset) + 'px';
    note.style.setProperty('--tip', (inset + button.offsetWidth / 2) + 'px');
  }

  function stop() {
    speechSynthesis.cancel();
    Array.prototype.forEach.call(document.querySelectorAll('.aloud-speaking'), function (el) {
      el.classList.remove('aloud-speaking');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.aloud.on'), function (b) {
      b.classList.remove('on'); b.textContent = '▶';
    });
    state.blocks = []; state.on = null;
  }

  function speakFrom(index) {
    var block = state.blocks[index];
    if (!block) return stop();
    Array.prototype.forEach.call(document.querySelectorAll('.aloud-speaking'), function (el) {
      el.classList.remove('aloud-speaking');
    });
    block.classList.add('aloud-speaking');
    var box = block.getBoundingClientRect();
    if (box.top > innerHeight - 80 || box.top < 60) {
      block.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    var queue = pieces(spoken(textOf(block))), done = 0;
    if (!queue.length) return speakFrom(index + 1);
    queue.forEach(function (line) {
      var u = new SpeechSynthesisUtterance(line);
      if (state.voice) { u.voice = state.voice; u.lang = state.voice.lang; }
      u.onend = u.onerror = function () {
        if (++done === queue.length && state.on) speakFrom(index + 1);
      };
      speechSynthesis.speak(u);
    });
  }

  function toggle(button, heading) {
    dismiss();
    var wasOn = button.classList.contains('on');
    stop();
    if (wasOn) return;
    state.on = button;
    state.blocks = blocksOf(heading);
    button.classList.add('on');
    button.textContent = '■';
    speakFrom(0);
  }

  function draw() {
    var name = state.voice ? state.voice.name.replace(/^Microsoft /, '').replace(/ - .*$/, '') : '';
    var headings = document.querySelectorAll('h2, h3');
    Array.prototype.forEach.call(headings, function (heading) {
      if (heading.closest('#TOC') || heading.querySelector('.aloud')) return;
      var button = document.createElement('button');
      button.className = 'aloud';
      button.textContent = '▶';
      button.title = 'Read aloud' + (name ? ' — ' + name : '');
      button.setAttribute('aria-label', button.title);
      button.addEventListener('click', function (e) { e.stopPropagation(); toggle(button, heading); });
      heading.insertBefore(button, heading.firstChild);
    });
    var first = document.querySelector('.aloud');
    if (first) callOut(first);
  }

  function pickVoice() {
    var all = speechSynthesis.getVoices();
    if (!all.length) return false;
    var en = all.filter(function (v) { return v.lang.indexOf('en') === 0; });
    state.voice =
      en.filter(function (v) { return /\bAndrew\b/i.test(v.name) && !/Multilingual/i.test(v.name); })[0] ||
      en.filter(function (v) { return /Andrew/i.test(v.name); })[0] ||
      en.filter(function (v) { return /Natural/i.test(v.name) && v.lang === 'en-US'; })[0] ||
      en.filter(function (v) { return v.default; })[0] || en[0] || null;
    return !!state.voice;
  }

  function start() { if (pickVoice()) draw(); }
  start();
  speechSynthesis.onvoiceschanged = start;   // most engines populate voices asynchronously
  addEventListener('beforeunload', function () { speechSynthesis.cancel(); });
})();
</script>
